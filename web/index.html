<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : sans lui, iOS laisse des bandes blanches autour de
         l'encoche en mode plein ecran, et env(safe-area-inset-*) reste a 0. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="description" content="Recettes, ingrédients, planning de la semaine et frigo." />

    <title>Livre de recettes</title>

    <!-- Installation sur l'ecran d'accueil iOS. Safari ignore encore une partie
         du manifeste : ces balises font le travail sur iPhone. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recettes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Deux couleurs : la barre systeme suit le theme du telephone. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f172a" />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script>
      // Applique le theme enregistre AVANT le premier rendu. Sans ce script
      // inline, un utilisateur en mode sombre voit un flash blanc au lancement.
      try {
        const saved = localStorage.getItem('theme')
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved
        }
      } catch {
        /* localStorage indisponible en navigation privee : on suit le systeme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
