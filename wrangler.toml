# =============================================================================
# Cloudflare Pages — site + API du Livre de recettes.
#
# C'est une configuration PAGES, pas WORKER. La distinction est structurante :
#
# Un Worker separe aurait besoin d'une route du type
# `livre-de-recette.pages.dev/api/*` — impossible, les routes Worker exigent un
# domaine qu'on possede, et `pages.dev` appartient a Cloudflare. Sans domaine
# personnalise, l'API doit donc etre livree AVEC le site.
#
# D'ou le mode avance de Pages Functions : le build produit
# `web/dist/_worker.js`, que Pages execute devant chaque requete. Il traite
# /api/*, et delegue tout le reste aux fichiers statiques via `env.ASSETS`.
#
# Consequence pratique : les liaisons (D1, KV, R2) declarees ici sont
# versionnees, au lieu d'etre saisies a la main dans le tableau de bord.
#
# Aucun secret dans ce fichier. Les jetons passent par
# `wrangler pages secret put`, et par .dev.vars en local — tous deux hors du
# depot, qui est public.
# =============================================================================

name = "livre-de-recette"
pages_build_output_dir = "web/dist"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# --- Base de donnees ---------------------------------------------------------
# Cet identifiant n'est PAS un secret : il n'autorise rien sans les
# identifiants du compte. Region WEUR (Europe de l'Ouest).
[[d1_databases]]
binding = "DB"
database_name = "livre-de-recettes"
database_id = "e4eef775-ab49-4585-a57e-f64d49899145"
migrations_dir = "migrations"

[vars]
# Envoye a OpenFoodFacts, qui limite plus severement les clients anonymes :
# s'identifier est dans notre interet.
#
# DEPOT PUBLIC — pas d'adresse mail ici. OFF accepte tres bien une URL de
# projet comme moyen de contact, ce qui evite d'exposer une adresse aux
# moissonneurs de spam.
OFF_USER_AGENT = "livre-de-recettes/0.2.0 (+https://github.com/MarckuusS/livre-de-recette)"
ENVIRONMENT = "production"

# --- A ajouter plus tard -----------------------------------------------------
# R2 (photos de recettes, PDF de tickets) : le jeton wrangler actuel n'a pas la
# portee `r2`. Il faudra la reautoriser avant de creer le bucket.
